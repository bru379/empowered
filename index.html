<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A/L Physics Resource Hub</title><style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1b1f33;--mut:#5d6483;--line:#e1e4f0;--acc:#4f46e5;--soft:#eef0ff;--ok:#0f9d6b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1120;--card:#171b2f;--ink:#e9ebf7;--mut:#9aa1c3;--line:#2a2f4b;--acc:#8b91ff;--soft:#222850;--ok:#3ddc9a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Tamil",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}h1{font-size:18px;margin:0}.top span{font-size:12px;color:var(--mut)}
#q{width:100%;margin:10px 0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;white-space:nowrap}
nav a b{color:var(--mut);font-weight:500;margin-left:4px}nav a.on{background:var(--acc);border-color:var(--acc);color:#fff}nav a.on b{color:#ffffffcc}
main{max-width:860px;margin:0 auto;padding:14px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);color:var(--ink);text-decoration:none}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;font-size:12.5px;color:var(--mut)}.card .n{float:right;font-size:22px;font-weight:700;color:var(--acc)}
.uh{display:flex;align-items:center;gap:10px;margin:2px 0 12px}.uh h2{margin:0;font-size:20px}.uh .n{background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:650;display:flex;justify-content:space-between;border-left:5px solid var(--acc);list-style:none}
summary::-webkit-details-marker{display:none}summary em{font-style:normal;font-size:12px;background:var(--soft);color:var(--acc);padding:2px 9px;border-radius:99px}
.grp{border-top:1px solid var(--line);padding:6px 0}.grp h4{margin:4px 14px;font-size:12.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line)}
.grp .it{border-top:0}.it:hover,.chip:hover{background:var(--soft)}.it i{font-style:normal;width:20px;text-align:center;color:var(--acc)}.it small{display:block;color:var(--mut);font-size:12px}
.yr{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);align-items:flex-start}.yr>b{flex:none;width:44px;padding-top:5px;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;min-width:38px;text-align:center}
.chip.ex{background:var(--soft);border-color:var(--acc);color:var(--acc);font-weight:600}.lg{font-size:12px;color:var(--mut);padding:8px 14px 0}
.res h3{font-size:14px;color:var(--mut);margin:14px 0 6px}.res .it{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
footer{margin-top:20px;font-size:12.5px;color:var(--mut);text-align:center}footer b{color:var(--ok)}.empty{text-align:center;color:var(--mut);padding:40px 0}
</style></head><body>
